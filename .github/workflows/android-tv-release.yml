name: HomeCloud TV Player — Android + parallel desktop packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# PR build code cannot publish releases or write repository contents.
permissions:
  contents: read

concurrency:
  group: homecloud-tv-platforms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-packages:
    name: Build and verify signed universal APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      NDK_VERSION: '30.0.16248370'
      CI: 'true'

    steps:
      - name: Checkout TV Player
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37.0 and NDK r30
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"

          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project if absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src-tauri/gen/android/app/build.gradle.kts ]; then
            npm run tauri android init -- --ci
          fi

      # A pull request is never given the real release signing credentials.
      - name: Prepare disposable signing key for PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir="$(mktemp -d "${RUNNER_TEMP}/hc-tv-ci-key-XXXXXX")"
          store="${key_dir}/ci-test.jks"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::${pass}"
          keytool -genkeypair \
            -keystore "$store" \
            -storetype JKS \
            -storepass "$pass" \
            -keypass "$pass" \
            -alias ci-validation-only \
            -keyalg RSA -keysize 3072 \
            -validity 2 \
            -dname 'CN=CI Validation Only,O=HomeCloud' \
            -noprompt >/dev/null 2>&1
          {
            printf 'HC_TV_KEYSTORE_FILE=%s\n' "$store"
            printf 'HC_TV_STORE_PASSWORD=%s\n' "$pass"
            printf 'HC_TV_KEY_PASSWORD=%s\n' "$pass"
            printf 'HC_TV_KEY_ALIAS=%s\n' 'ci-validation-only'
          } >> "$GITHUB_ENV"
          echo 'Disposable test signing key prepared.'

      - name: Configure real release signing (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HC_TV_JKS_BASE64: ${{ secrets.HC_TV_JKS_BASE64 }}
          HC_TV_STORE_PASSWORD: ${{ secrets.HC_TV_STORE_PASSWORD }}
          HC_TV_KEY_PASSWORD: ${{ secrets.HC_TV_KEY_PASSWORD }}
          HC_TV_KEY_ALIAS: ${{ secrets.HC_TV_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$HC_TV_STORE_PASSWORD"
          test -n "$HC_TV_KEY_PASSWORD"
          test -n "$HC_TV_KEY_ALIAS"
          python3 .github/scripts/prepare_android.py --ci
          {
            printf 'HC_TV_STORE_PASSWORD=%s\n' "$HC_TV_STORE_PASSWORD"
            printf 'HC_TV_KEY_PASSWORD=%s\n' "$HC_TV_KEY_PASSWORD"
            printf 'HC_TV_KEY_ALIAS=%s\n' "$HC_TV_KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo 'Release signing credentials prepared securely.'

      # Keep Android versionCode increasing for successive Google Play uploads.
      # Tauri's --config JSON is merged with src-tauri/tauri.conf.json.
      - name: Build signed universal APK and AAB (all ABIs)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HC_TV_KEYSTORE_FILE:-}"
          test -f "$HC_TV_KEYSTORE_FILE"
          version_code="$(date -u +%s)"
          # Unix UTC seconds are monotonic for normal new runs and below Play\x27s 2.1B limit until 2036.
          if [ "$version_code" -gt 2100000000 ]; then echo "Android versionCode exceeds Google Play limit" >&2; exit 1; fi
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Android versionCode: $version_code"
          # GitHub's JetBrains Kotlin/compiler artifacts sometimes return
          # transient HTTP 502/504. Gradle caches successful downloads, so
          # retrying the SAME versionCode does not change Play identity.
          for attempt in 1 2 3 4 5; do
            if npm run tauri android build -- --apk --aab --ci \
              --config "{\"bundle\":{\"android\":{\"versionCode\":$version_code}}}"; then
              echo "Android packages built on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Android packaging failed after five attempts" >&2
              exit 1
            fi
            sleep $((attempt*15))
          done

      - name: Locate and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name '*universal*release*.apk' \
            ! -name '*unsigned*' | head -n1)"

          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo 'Signed universal release APK not found.' >&2
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$apk"
          sha256sum "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Locate and verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/gen/android/app/build/outputs/bundle"
          test -d "$bundle_dir"
          mapfile -t bundles < <(find "$bundle_dir" -type f -name '*.aab' | sort)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one Android App Bundle, found ${#bundles[@]}." >&2
            printf '%s\n' "${bundles[@]}" >&2
            exit 1
          fi
          aab="${bundles[0]}"
          jarsigner -verify -verbose "$aab" > "$RUNNER_TEMP/aab-signature-check.txt" 2>&1 || {
            cat "$RUNNER_TEMP/aab-signature-check.txt" >&2
            exit 1
          }
          if ! grep -q 'jar verified' "$RUNNER_TEMP/aab-signature-check.txt"; then
            echo 'Android App Bundle signature verification did not report success.' >&2
            exit 1
          fi
          echo "AAB signature verified."
          sha256sum "$aab"
          echo "AAB_PATH=$aab" >> "$GITHUB_ENV"

      - name: Verify Android TV launcher in packaged APK
        shell: bash
        run: |
          set -euo pipefail
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_PATH")"
          if ! grep -q '^leanback-launchable-activity:' <<< "$badging"; then
            echo 'APK has no Android TV LEANBACK_LAUNCHER activity.' >&2
            exit 1
          fi
          echo 'Packaged APK declares an Android TV launcher activity.'

      - name: Upload signed APK and AAB for main release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: homecloud-tv-signed-packages
          path: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 3

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: |
          if [ -n "${HC_TV_KEYSTORE_FILE:-}" ]; then
            rm -f -- "$HC_TV_KEYSTORE_FILE"
          fi


  # Android, Windows (NSIS+MSI), DEB, RPM and AppImage execute on independent runners.
  # Only the two Windows installers share a job; Linux formats remain separate.
  desktop-packages:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-installers, os: windows-2022, bundle: 'nsis,msi', ext: exe }
          - { target: linux-deb, os: ubuntu-24.04, bundle: deb, ext: deb }
          - { target: linux-rpm, os: ubuntu-24.04, bundle: rpm, ext: rpm }
          - { target: linux-appimage, os: ubuntu-24.04, bundle: appimage, ext: AppImage }
    env:
      CI: 'true'
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: Checkout TV Player
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust desktop toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Linux WebKitGTK and packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev file rpm libfuse2t64
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: tv-${{ matrix.target }}
      - name: Install frontend
        run: npm ci
      - name: Build Windows NSIS and MSI together (same approach as HomeCloudUI)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles nsis,msi --config src-tauri/tauri.desktop.conf.json
      - name: Compile Linux executable once (no bundler network calls)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --no-bundle --config src-tauri/tauri.desktop.conf.json
      - name: Bundle Linux ${{ matrix.bundle }} with retries for transient tool download 5xx
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm run tauri -- bundle --bundles "${{ matrix.bundle }}" --config src-tauri/tauri.desktop.conf.json; then
              echo "Bundling ${{ matrix.bundle }} succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Bundling ${{ matrix.bundle }} failed after five attempts" >&2
              exit 1
            fi
            sleep $((attempt*15))
          done
      - name: Verify Linux artifact and calculate SHA-256
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/target/release/bundle/${{ matrix.bundle }}"
          test -d "$dir"
          mapfile -t results < <(find "$dir" -maxdepth 1 -type f -iname "*.${{ matrix.ext }}" | sort)
          if [ "${#results[@]}" -ne 1 ]; then
            echo "Expected one ${{ matrix.target }} artifact, found ${#results[@]}" >&2
            find "$dir" -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          sha256sum "${results[0]}"
          echo "BUNDLE_PATH=${results[0]}" >> "$GITHUB_ENV"
      - name: Save Linux ${{ matrix.target }}
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: homecloud-tv-desktop-${{ matrix.target }}
          path: ${{ env.BUNDLE_PATH }}
          if-no-files-found: error
          retention-days: 7
      - name: Verify and collect both Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          foreach ($kind in @('nsis', 'msi')) {
            $extension = if ($kind -eq 'nsis') { '*.exe' } else { '*.msi' }
            $files = @(Get-ChildItem -Path "src-tauri/target/release/bundle/$kind" -Filter $extension -File -ErrorAction Stop)
            if ($files.Count -ne 1) { throw "Expected exactly one $kind installer; found $($files.Count)" }
            Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName | Format-List
            Copy-Item -LiteralPath $files[0].FullName -Destination release-assets/
          }
      - name: Save Windows NSIS and MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: homecloud-tv-desktop-windows-installers
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7


  publish-release:
    name: Publish verified APK and AAB to GitHub Release
    needs: android-packages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download signed APK and AAB
        uses: actions/download-artifact@v4
        with:
          name: homecloud-tv-signed-packages
          path: release-artifact

      - name: Publish APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-artifact -type f -name '*.apk' | sort)
          mapfile -t aabs < <(find release-artifact -type f -name '*.aab' | sort)
          if [ "${#apks[@]}" -ne 1 ] || [ "${#aabs[@]}" -ne 1 ]; then
            echo "Expected exactly one APK and one AAB, found ${#apks[@]} APK and ${#aabs[@]} AAB." >&2
            exit 1
          fi

          apk="${apks[0]}"
          aab="${aabs[0]}"
          short_sha="${GITHUB_SHA:0:12}"
          tag="tv-${short_sha}"
          apk_asset="${apk}#HomeCloud-TV-Player-${tag}-universal.apk"
          aab_asset="${aab}#HomeCloud-TV-Player-${tag}-universal.aab"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk_asset" "$aab_asset" --clobber
          else
            gh release create "$tag" "$apk_asset" "$aab_asset" \
              --target "$GITHUB_SHA" \
              --title "HomeCloud TV Player $tag" \
              --generate-notes --latest
          fi
          echo "Release published with signed APK and AAB."

  # Do not block the signed Android release when a desktop bundle fails.
  # Upload desktop formats only once all four desktop jobs and Android publication pass.
  publish-desktop:
    name: Attach Windows and Linux bundles to TV release
    needs: [desktop-packages, publish-release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all five desktop formats
        uses: actions/download-artifact@v4
        with:
          pattern: homecloud-tv-desktop-*
          merge-multiple: true
          path: desktop-artifacts
      - name: Validate and extend the existing signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(desktop-artifacts/*.exe)
          msis=(desktop-artifacts/*.msi)
          debs=(desktop-artifacts/*.deb)
          rpms=(desktop-artifacts/*.rpm)
          appimages=(desktop-artifacts/*.AppImage)
          for group in exes msis debs rpms appimages; do
            declare -n files="$group"
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Missing or duplicated $group bundle" >&2
              exit 1
            fi
          done
          cd desktop-artifacts
          sha256sum ./* > SHA256SUMS-desktop.txt
          tag="tv-${GITHUB_SHA:0:12}"
          gh release view "$tag" >/dev/null
          gh release upload "$tag" \
            ./*.exe ./*.msi ./*.deb ./*.rpm ./*.AppImage \
            SHA256SUMS-desktop.txt --clobber
          echo "Uploaded Windows NSIS/MSI and Linux DEB/RPM/AppImage to $tag"
